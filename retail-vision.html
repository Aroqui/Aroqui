<!DOCTYPE html>

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Saltar para o conteúdo</a>
  <header class="header">
    <div class="brand" aria-label="Marca Horizonte Multimídia">
      <span class="brand__logo" aria-hidden="true">HM</span>
      <span class="sr-only">Horizonte Multimídia</span>
    </div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Abrir menu de navegação">
      <span></span><span></span><span></span>
    </button>
    <nav id="nav-menu" class="nav" aria-label="Navegação principal">
      <ul>
        <li><a href="index.html#hero">Início</a></li>
        <li><a href="index.html#projects">Projetos</a></li>
        <li><a href="index.html#clients">Clientes</a></li>
        <li><a href="index.html#contact">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo-principal" class="brand-page">
    <section class="brand-logo-full">
      <img src="assets/img/brands/retail-vision.svg" alt="Logo Retail Vision" />
    </section>

    <section class="glass-card brand-description">
      <p class="eyebrow">Identidade visual</p>
      <h1>Retail Vision</h1>
      <p class="lead">Varejo com vitrines verticais 2:3, CTAs persistentes e carregamento otimizado para catálogos mobile-first.</p>
    </section>

    <section class="brand-duo">
      <img src="https://images.unsplash.com/photo-1483478550801-ceba5fe50e8e?auto=format&fit=crop&w=1200&q=80" alt="Moodboard Retail Vision 1" />
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=1200&q=80" alt="Moodboard Retail Vision 2" />
    </section>

    <section class="brand-sign">
      <img src="assets/img/brands/retail-vision.svg" alt="Assinatura Retail Vision" />
    </section>

    <section class="brand-palette">
      <img src="https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=900&q=80" alt="Paleta cromática Retail Vision" />
      <img src="https://images.unsplash.com/photo-1522199710521-72d69614c702?auto=format&fit=crop&w=900&q=80" alt="Mockups Retail Vision" />
    </section>

    <a class="back-link" href="index.html#projects">← Voltar para Projetos</a>
