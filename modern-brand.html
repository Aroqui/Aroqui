<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Brand | Horizonte Multimídia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Saltar para o conteúdo</a>
  <header class="header">
    <div class="brand" aria-label="Marca Horizonte Multimídia">
      <span class="brand__logo" aria-hidden="true">HM</span>
      <span class="sr-only">Horizonte Multimídia</span>
    </div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Abrir menu de navegação">
      <span></span><span></span><span></span>
    </button>
    <nav id="nav-menu" class="nav" aria-label="Navegação principal">
      <ul>
        <li><a href="index.html#hero">Início</a></li>
        <li><a href="index.html#projects">Projetos</a></li>
        <li><a href="index.html#clients">Clientes</a></li>
        <li><a href="index.html#contact">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo-principal" class="brand-page">
    <section class="brand-logo-full">
      <img src="assets/img/brands/modern-brand.svg" alt="Logo Modern Brand" />
    </section>

    <section class="glass-card brand-description">
      <p class="eyebrow">Identidade visual</p>
      <h1>Modern Brand</h1>
      <p class="lead">Identidade urbana com gradientes iridescentes, aplicada em fachadas digitais e vitrines 2:3 focadas em conversão mobile-first.</p>
    </section>

    <section class="brand-duo">
      <img src="https://images.unsplash.com/photo-1545239351-1141bd82e8a6?auto=format&fit=crop&w=1200&q=80" alt="Moodboard Modern Brand 1" />
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=1200&q=80" alt="Moodboard Modern Brand 2" />
    </section>

    <section class="brand-sign">
      <img src="assets/img/brands/modern-brand.svg" alt="Assinatura Modern Brand" />
    </section>

    <section class="brand-palette">
      <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80" alt="Paleta cromática Modern Brand" />
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mockups Modern Brand" />
    </section>

    <div class="brand-actions" style="justify-content:center;">
      <a class="btn ghost" href="https://www.instagram.com/horizontemultimidia/" target="_blank" rel="noreferrer">Instagram</a>
    </div>

    <a class="back-link" href="index.html#projects">← Voltar para Projetos</a>
  </main>

  <button class="scroll-top" type="button" aria-label="Voltar ao topo">↑</button>
  <script src="assets/js/main.js"></script>
</body>
</html>
